
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Complaint Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .register-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0002;
        }
        h2 { text-align: center; color: #234a84; }
        label { display: block; margin-top: 14px; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #234a84;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .errorlist { color: red; font-size: 13px; }
        .helptext { font-size: 12px; color: #666; }
        p { text-align: center; }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>Student Registration</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
            {{ form.username.errors }}

            <label for="{{ form.email.id_for_label }}">Email</label>
            {{ form.email }}
            {{ form.email.errors }}

            <label for="{{ form.password1.id_for_label }}">Password</label>
            {{ form.password1 }}
            {{ form.password1.errors }}

            <label for="{{ form.password2.id_for_label }}">Confirm Password</label>
            {{ form.password2 }}
            {{ form.password2.errors }}

            <button type="submit">Create Account</button>
        </form>

        <p>Already registered? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</body>
</html>
